<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ECLIPSE ARENA — 액션 AOS</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="view"></canvas>

<section id="screen-title" class="screen">
  <div class="title-box">
    <p class="kicker">3 vs 3 ACTION AOS</p>
    <h1>ECLIPSE<span>ARENA</span></h1>
    <p class="sub">타워를 부수고 적 코어를 파괴하라</p>
    <button id="btn-start" class="btn primary" disabled>불러오는 중…</button>
  </div>
</section>

<section id="screen-select" class="screen hidden">
  <h2>영웅 선택</h2>
  <div id="hero-cards"></div>
  <div class="select-foot">
    <div class="diff">
      <span>난이도</span>
      <button class="btn small" data-diff="0">쉬움</button>
      <button class="btn small on" data-diff="1">보통</button>
      <button class="btn small" data-diff="2">어려움</button>
    </div>
    <div class="keys">
      <b>WASD</b> 이동 · <b>마우스</b> 조준 · <b>좌/우클릭</b> 공격·스킬 · <b>Q</b> 스킬 · <b>E</b> 궁극기 · <b>Space</b> 회피 · <b>Tab</b> 점수판 · <b>Esc</b> 일시정지
    </div>
    <button id="btn-play" class="btn primary">전투 시작</button>
  </div>
</section>

<div id="hud" class="hidden">
  <div id="top">
    <div class="team blue"><span class="towers" id="tw0"></span><b id="k0">0</b></div>
    <div id="clock">00:00</div>
    <div class="team red"><b id="k1">0</b><span class="towers" id="tw1"></span></div>
  </div>
  <div id="feed"></div>
  <div id="announce"></div>
  <div id="respawn" class="hidden"><p>처치당했습니다</p><b id="respawn-t">5</b><span>초 후 부활</span></div>
  <div id="bottom">
    <div id="me-portrait"></div>
    <div id="me-info">
      <div class="row"><b id="me-name"></b><span id="me-lv"></span><span id="me-kda"></span></div>
      <div class="bar hp"><i id="me-hp"></i><em id="me-hp-t"></em></div>
      <div class="bar xp"><i id="me-xp"></i></div>
      <div id="skills"></div>
    </div>
  </div>
  <canvas id="minimap" width="286" height="165"></canvas>
  <div id="touch" class="hidden">
    <div id="joy-zone"><div id="joy"><i></i></div></div>
    <div id="tbtns">
      <button data-slot="lmb" class="tb main">공격</button>
      <button data-slot="rmb" class="tb b1"></button>
      <button data-slot="q" class="tb b2"></button>
      <button data-slot="e" class="tb b3 ult"></button>
      <button data-slot="space" class="tb b4">회피</button>
    </div>
    <button id="tb-pause" class="tb-mini">Ⅱ</button>
    <button id="tb-score" class="tb-mini">☰</button>
  </div>
  <div id="scoreboard" class="hidden"></div>
  <div id="pause" class="hidden"><div><h2>일시정지</h2><button id="btn-resume" class="btn primary">계속하기</button><button id="btn-quit" class="btn">영웅 선택으로</button></div></div>
</div>

<section id="screen-end" class="screen hidden">
  <div class="end-box">
    <h1 id="end-title">승리</h1>
    <p id="end-sub"></p>
    <div id="end-table"></div>
    <button id="btn-again" class="btn primary">다시 하기</button>
  </div>
</section>

<script type="module" src="js/main.js"></script>
</body>
</html>
