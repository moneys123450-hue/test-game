<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>카이 · 캐릭터 비교</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0c1421;color:#e7f1fa;font:15px/1.5 system-ui,'Malgun Gothic',sans-serif}canvas{display:block;width:100vw;height:calc(100dvh - 170px);touch-action:none}header{position:absolute;top:24px;left:28px;pointer-events:none}h1{margin:4px 0 10px;font-size:30px}small{color:#6cdaec;letter-spacing:.15em}.tools{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);width:min(680px,94vw);padding:16px;background:#101c2beb;border:1px solid #304454;border-radius:14px;backdrop-filter:blur(12px)}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}button,a{border:1px solid #3b5366;border-radius:7px;background:#1c2b3d;color:#e7f1fa;padding:9px 14px;font:inherit;text-decoration:none;cursor:pointer}button.active{background:#68d8ed;color:#102333;border-color:#68d8ed}p{margin:9px 0 0;color:#9bb0c3;font-size:13px}#status{max-width:70vw;color:#b0c5d5}a{margin-left:auto}button:disabled{opacity:.4;cursor:default}@media(max-width:600px){header{top:14px;left:18px}h1{font-size:23px}.tools{bottom:12px;padding:12px}button,a{padding:7px 10px}}
</style>
</head>
<body>
<canvas id="view" aria-label="카이 3D 캐릭터 미리보기"></canvas>
<header><small>ECLIPSE ARENA / CHARACTER LAB</small><h1>카이 · 섬광의 검사</h1><div id="status">모델 불러오는 중…</div></header>
<div class="tools"><div class="row"><button data-model="anime" class="active">새 캐릭터</button><button data-model="block">이전 블록 모델</button><a href="/">게임에서 보기 ↗</a></div><div class="row" style="margin-top:10px"><button data-clip="Idle" class="active">대기</button><button data-clip="Run">달리기</button><button data-clip="Slash">베기</button><button id="face">얼굴 확대</button><button id="full">전체 보기</button></div><p>드래그: 회전 · 휠: 확대/축소 · 실제 게임과 조명은 다릅니다.</p></div>
<script type="module">
import * as THREE from './vendor/three.module.min.js';
import { GLTFLoader } from './vendor/loaders/GLTFLoader.js';
const renderer=new THREE.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;
const scene=new THREE.Scene();scene.background=new THREE.Color('#101a29');scene.fog=new THREE.Fog('#101a29',12,25);
const camera=new THREE.PerspectiveCamera(34,1,.02,60);
scene.add(new THREE.HemisphereLight('#dcefff','#3c4256',2.3));
for(const [color,intensity,x,y,z]of[['#fff0e3',3,3,5,4],['#4dd9ff',3,-3,3,-3]]){
const l=new THREE.DirectionalLight(color,intensity);l.position.set(x,y,z);l.castShadow=true;l.shadow.mapSize.set(2048,2048);l.shadow.bias=-.0005;l.shadow.normalBias=.015;scene.add(l)}
const stage=new THREE.Mesh(new THREE.CylinderGeometry(.8,.85,.045,80),new THREE.MeshStandardMaterial({color:'#202f42',roughness:.9}));stage.position.y=-.03;stage.receiveShadow=true;scene.add(stage);
const ring=new THREE.Mesh(new THREE.TorusGeometry(.79,.005,6,80),new THREE.MeshBasicMaterial({color:'#4abbd0'}));ring.rotation.x=Math.PI/2;ring.position.y=-.004;scene.add(ring);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(60,60),new THREE.MeshStandardMaterial({color:'#142031',roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.06;floor.receiveShadow=true;scene.add(floor);
let model,mixer,actions={},current,angle=.45,pitch=.13,distance=4.2,targetY=1.05,request=0;
function resize(){const h=Math.max(240,innerHeight-170);renderer.setSize(innerWidth,h,false);camera.aspect=innerWidth/h;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();
function play(name){const a=actions[name];if(!a)return;if(current)current.fadeOut(.14);a.reset().fadeIn(.14).play();current=a;document.querySelectorAll('[data-clip]').forEach(b=>b.classList.toggle('active',b.dataset.clip===name));}
async function load(type){
const id=++request;document.querySelector('#status').textContent='모델 불러오는 중…';
try{const gltf=await new GLTFLoader().loadAsync(`./art/kai-blender/${type==='anime'?'kai-anime':'kai-prototype'}.glb`);if(id!==request)return;
if(model){scene.remove(model);model.traverse(o=>{if(o.geometry)o.geometry.dispose();for(const m of o.material?(Array.isArray(o.material)?o.material:[o.material]):[])m.dispose()});if(mixer)mixer.stopAllAction();}
model=gltf.scene;model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;if(o.isSkinnedMesh)o.frustumCulled=false;
const toon=m=>new THREE.MeshToonMaterial({color:m.color,emissive:m.emissive,emissiveIntensity:m.emissiveIntensity,side:m.side});o.material=Array.isArray(o.material)?o.material.map(toon):toon(o.material)}});scene.add(model);
mixer=new THREE.AnimationMixer(model);actions={};current=null;for(const c of gltf.animations)actions[c.name]=mixer.clipAction(c);play('Idle');
document.querySelectorAll('[data-clip]').forEach(b=>b.disabled=!actions[b.dataset.clip]);document.querySelectorAll('[data-model]').forEach(b=>b.classList.toggle('active',b.dataset.model===type));
document.querySelector('#status').textContent=type==='anime'?'곡면 인체 · 스킨 가중치 · 뼈대 애니메이션':'이전 시제품 · 정적 도형 조합';
window.__character={model,mixer,actions,play};
}catch(e){document.querySelector('#status').textContent='모델을 불러오지 못했습니다';console.error(e)}}
document.querySelectorAll('[data-model]').forEach(b=>b.onclick=()=>load(b.dataset.model));document.querySelectorAll('[data-clip]').forEach(b=>b.onclick=()=>play(b.dataset.clip));
document.querySelector('#face').onclick=()=>{distance=.9;targetY=1.79;pitch=.01;angle=.12};document.querySelector('#full').onclick=()=>{distance=4.2;targetY=1.05;pitch=.13};
const canvas=renderer.domElement;let drag=null;canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)};canvas.onpointerup=()=>drag=null;canvas.onpointercancel=()=>drag=null;canvas.onpointermove=e=>{if(!drag)return;angle-=(e.clientX-drag[0])*.007;pitch=THREE.MathUtils.clamp(pitch+(e.clientY-drag[1])*.005,-.6,.8);drag=[e.clientX,e.clientY]};canvas.addEventListener('wheel',e=>{e.preventDefault();distance=THREE.MathUtils.clamp(distance+e.deltaY*.003,.55,7)},{passive:false});
const clock=new THREE.Clock();function frame(){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.05);if(mixer)mixer.update(dt);camera.position.set(Math.sin(angle)*distance*Math.cos(pitch),targetY+Math.sin(pitch)*distance,Math.cos(angle)*distance*Math.cos(pitch));camera.lookAt(0,targetY,0);renderer.render(scene,camera)}load('anime');frame();
</script>
</body></html>
